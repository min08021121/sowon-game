<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2160">
<title>소원 이벤트 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 오락실 점수판 — 상단 게임 카드 3장, 아래 분야별 순위표. 게임은 고정 비율(360×600) 화면을 전체 화면에 맞춰 띄움 */
:root {
  --bg: #1a2160;
  --panel: #242c74;
  --panel-2: #2f388a;
  --line: #424c9e;
  --fg: #f3f2ff;
  --muted: #b0b4e2;
  --pink: #ff5c93;
  --lemon: #ffd447;
  --mint: #4ee6c9;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
button { touch-action: manipulation; }
.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
header h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(32px, 8vw, 50px);
  line-height: 1.1;
  margin: 0;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
header h1 .hl { color: var(--lemon); }
header p { margin: 8px 0 0; color: var(--muted); }
.notice {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--lemon);
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.card .tag {
  font-family: var(--font-num);
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.card h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 28px;
  margin: 0;
  line-height: 1.15;
}
.card[data-game="knife"] h2 { color: var(--pink); }
.card[data-game="runner"] h2 { color: var(--mint); }
.card[data-game="stack"] h2 { color: var(--lemon); }
.card .desc { margin: 0; color: var(--muted); font-size: 14px; }
.card .how { margin: 0; font-size: 13px; color: var(--fg); }
.champ {
  background: var(--panel-2);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 10px;
}
.champ .lbl { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; }
.champ .who { font-weight: 700; overflow-wrap: anywhere; }
.champ .sc { font-family: var(--font-num); font-weight: 700; font-size: 22px; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.champ .sc span { font-size: 13px; color: var(--muted); margin-left: 4px; }
.btn {
  appearance: none;
  border: 0;
  border-radius: 12px;
  min-height: 50px;
  padding: 12px 16px;
  font: 700 17px/1 var(--font-body);
  cursor: pointer;
  background: var(--fg);
  color: var(--bg);
  transition: transform .08s ease, filter .15s ease;
}
.btn:hover { filter: brightness(0.92); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, input:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.btn.play { margin-top: auto; }
.card[data-game="knife"] .btn.play { background: var(--pink); }
.card[data-game="runner"] .btn.play { background: var(--mint); }
.card[data-game="stack"] .btn.play { background: var(--lemon); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }

.board { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.board-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.board h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.chip {
  appearance: none; border: 1px dashed var(--line); background: transparent; color: var(--muted);
  border-radius: 999px; padding: 6px 12px; font: 500 13px/1 var(--font-body); cursor: pointer;
}
.chip[aria-pressed="true"] { border-style: solid; border-color: var(--lemon); color: var(--lemon); }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tab {
  appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
  border-radius: 12px; min-height: 44px; padding: 8px 6px; font: 500 14px/1.2 var(--font-body); cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 700; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 11px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.rank { font-family: var(--font-num); font-weight: 700; width: 44px; color: var(--muted); }
tr.top1 td.rank { color: var(--lemon); }
tr.top2 td.rank, tr.top3 td.rank { color: var(--fg); }
td.nick { font-weight: 700; overflow-wrap: anywhere; }
td.real { color: var(--lemon); }
td.score { font-family: var(--font-num); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.score span { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 3px; }
th.r { text-align: right; }
td.del { width: 1%; white-space: nowrap; }
.del-btn { appearance: none; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; font: 500 12px/1 var(--font-body); padding: 8px 10px; cursor: pointer; }
.del-btn.armed { border-color: var(--pink); color: var(--pink); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.foot { display: flex; justify-content: center; }

/* 이름 입력 */
.modal {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(10, 12, 40, 0.72);
  display: flex;
  overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 22px; display: flex; flex-direction: column; gap: 14px; margin: auto;
}
.sheet h4 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; }
.field input {
  background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 12px;
  min-height: 50px; padding: 12px; font: 500 16px var(--font-body);
}
.err { color: var(--pink); font-size: 13px; min-height: 1em; }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 340px) { .controls { grid-template-columns: 1fr; } }
.ctl { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.ctl h5 { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--lemon); letter-spacing: 0.04em; }
.ctl ul { margin: 0; padding-left: 16px; font-size: 13px; line-height: 1.45; color: var(--fg); }
.ctl li + li { margin-top: 3px; }
.row { display: flex; gap: 8px; }
.row .btn { flex: 1; }

/* 게임 화면 */
.game {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.gbar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.gbar .gt { font-family: var(--font-display); font-size: 19px; white-space: nowrap; }
.gbar .gp { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.gbar .gs { font-family: var(--font-num); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.gbar .x { min-height: 40px; padding: 8px 12px; font-size: 14px; }
.stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; padding: 6px; touch-action: none; }
canvas { display: block; touch-action: none; border-radius: 12px; }
.over {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background: rgba(10, 12, 40, 0.6);
  touch-action: manipulation;
}
.over .sheet { text-align: center; align-items: stretch; }
.big { font-family: var(--font-num); font-weight: 700; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { font-size: 18px; color: var(--muted); margin-left: 6px; }
.res-msg { font-weight: 700; }
.res-msg.best { color: var(--lemon); }
.stack-btns { display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

</head>
<body>
<!-- ===== 설정: 아래 두 곳만 본인 값으로 바꾸세요 ===== -->
<script>
  // Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값
  window.FIREBASE_CONFIG = {
    apiKey: "여기에_apiKey",
    authDomain: "여기에_authDomain",
    projectId: "여기에_projectId",
    storageBucket: "여기에_storageBucket",
    messagingSenderId: "여기에_messagingSenderId",
    appId: "여기에_appId"
  };
  // 관리자 계정 이메일 (화면에는 안 보이고, 관리자는 비밀번호만 입력해요. 보안 규칙과 같은 이메일)
  window.ADMIN_EMAIL = "admin@example.com";
</script>
<!-- ===== 설정 끝 ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<div class="wrap">
  <header>
    <h1>소원 <span class="hl">이벤트 게임</span></h1>
    <p>닉네임으로 순위에 도전하세요. 도전은 무제한, 분야별 1등에게 상품을 드려요.</p>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="cards" id="cards"></section>

  <section class="board">
    <div class="board-head">
      <h3>분야별 순위</h3>
      <button class="chip" id="realToggle" type="button" aria-pressed="false" hidden>실명 보기 (관리자)</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>순위</th><th>닉네임</th><th id="realHead" hidden>실명</th><th class="r">점수</th><th id="delHead" hidden></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot"><button class="chip" id="adminBtn" type="button">관리자 로그인</button></footer>
</div>

<div class="modal" id="adminModal" hidden>
  <form class="sheet" id="adminForm" novalidate>
    <h4>관리자 로그인</h4>
    <p>관리자 비밀번호를 입력하면 실명 확인과 기록 삭제를 할 수 있어요.</p>
    <div class="field">
      <label for="adPw">관리자 비밀번호</label>
      <input id="adPw" type="password" autocomplete="current-password">
    </div>
    <div class="err" id="adminErr"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="adminCancel">취소</button>
      <button type="submit" class="btn">로그인</button>
    </div>
  </form>
</div>

<div class="modal" id="nameModal" hidden>
  <form class="sheet" id="nameForm" novalidate>
    <h4 id="nameTitle">플레이어 정보</h4>
    <div class="controls" id="controls"></div>
    <p>순위표에는 닉네임과 점수만 보여요. 실명은 상품을 받을 때 본인 확인에만 써요.</p>
    <div class="field">
      <label for="inName">실명</label>
      <input id="inName" maxlength="20" autocomplete="off" enterkeyhint="next" placeholder="예: 홍길동">
    </div>
    <div class="field">
      <label for="inNick">닉네임</label>
      <input id="inNick" maxlength="12" autocomplete="off" enterkeyhint="go" placeholder="예: 칼피하기장인">
    </div>
    <div class="err" id="nameErr"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="nameCancel">취소</button>
      <button type="submit" class="btn">게임 시작</button>
    </div>
  </form>
</div>

<div class="game" id="game" hidden>
  <div class="gbar">
    <div class="gt" id="gTitle"></div>
    <div class="gp" id="gPlayer"></div>
    <div class="gs" id="gScore">0</div>
    <button class="btn ghost x" id="gQuit" type="button">나가기</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="over" id="over" hidden>
      <div class="sheet">
        <p id="oTitle">게임 오버</p>
        <div class="big" id="oScore"></div>
        <div class="res-msg" id="oMsg"></div>
        <p id="oSub"></p>
        <div class="stack-btns">
          <button class="btn" id="oRetry" type="button">다시 플레이하기</button>
          <button class="btn ghost" id="oHome" type="button">처음 화면으로 돌아가기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 360, H = 600, STEP = 1 / 120;
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const C = { bg: tok('--bg'), panel: tok('--panel'), panel2: tok('--panel-2'), line: tok('--line'), fg: tok('--fg'),
              muted: tok('--muted'), pink: tok('--pink'), lemon: tok('--lemon'), mint: tok('--mint') };
  const NUMFONT = '"JetBrains Mono", ui-monospace, monospace';
  const BODYFONT = '"IBM Plex Sans KR", system-ui, sans-serif';
  const TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;

  const GAMES = {
    knife:  { tag: 'GAME 01', title: '칼 피하기', unit: '초', fmt: s => s.toFixed(2), max: 7200,
              desc: '칼, 표창, 바위, 도끼, 레이저를 피해 오래 버티세요.',
              pc: ['마우스를 좌우로 움직이거나 ← → 방향키로 이동'],
              mobile: ['화면 아무 곳이나 누른 채 좌우로 드래그해서 이동', '손가락이 캐릭터를 가리지 않아도 돼요'] },
    runner: { tag: 'GAME 02', title: '장애물 피하기', unit: 'm', fmt: s => String(Math.floor(s)), max: 500000,
              desc: '상자, 구덩이, 새, 통통 튀는 공을 넘으며 멀리 달리세요.',
              pc: ['스페이스바(또는 ↑)로 점프', '짧게 누르면 낮게, 길게 누르면 높게', '공중에서 한 번 더 누르면 2단 점프'],
              mobile: ['화면을 탭하면 점프', '짧게 탭하면 낮게, 길게 누르면 높게', '공중에서 한 번 더 탭하면 2단 점프'] },
    stack:  { tag: 'GAME 03', title: '탑 쌓기', unit: '층', fmt: s => String(s), max: 5000,
              desc: '움직이는 블록을 타이밍 맞춰 내려놓아 높이 쌓으세요.',
              pc: ['스페이스바 또는 클릭으로 블록 내려놓기', '아래 블록과 딱 맞추면 PERFECT'],
              mobile: ['화면을 탭해서 블록 내려놓기', '아래 블록과 딱 맞추면 PERFECT'] },
  };
  const IDS = Object.keys(GAMES);
  const hintOf = id => (TOUCH ? GAMES[id].mobile : GAMES[id].pc)[0];

  // ---------- 저장소 (Firebase Firestore) ----------
  let db = null, auth = null, isAdmin = false, showReal = false, mode = 'loading', canWrite = true;
  const records = { knife: [], runner: [], stack: [] };
  const realNames = { knife: {}, runner: {}, stack: {} };
  let privUnsubs = [];
  const $ = id => document.getElementById(id);

  const normName = s => s.replace(/\s+/g, ' ').trim();
  async function keyOf(name) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sowon-event:' + name));
    return 'p' + Array.from(new Uint8Array(buf)).slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const sortRecs = list => list.slice().sort((a, b) => (b.score - a.score) || ((a.at || 0) - (b.at || 0)));
  function showNotice(text) { const n = $('notice'); n.textContent = text; n.hidden = !text; }

  function initStore() {
    const cfg = window.FIREBASE_CONFIG || {};
    try {
      if (!window.firebase || !cfg.apiKey || cfg.apiKey.indexOf('여기에') === 0) throw new Error('config');
      firebase.initializeApp(cfg);
      db = firebase.firestore(); auth = firebase.auth();
      auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => {});
    } catch (e) {
      mode = 'off';
      showNotice('Firebase 설정값이 아직 들어 있지 않아 기록이 저장되지 않아요. index.html 위쪽의 설정값을 채워 주세요.');
      renderAll(); return;
    }
    mode = 'db';
    for (const id of IDS) {
      db.collection('scores_' + id).orderBy('score', 'desc').limit(100).onSnapshot(snap => {
        records[id] = sortRecs(snap.docs.map(d => ({ key: d.id, ...d.data() })).filter(r => typeof r.score === 'number'));
        renderAll();
      }, () => showNotice('순위를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'));
    }
    auth.onAuthStateChanged(u => {
      const adminEmail = String(window.ADMIN_EMAIL || '').toLowerCase();
      if (u && (u.email || '').toLowerCase() !== adminEmail) { auth.signOut(); showNotice('관리자 계정이 아니에요.'); return; }
      isAdmin = !!u;
      privUnsubs.forEach(f => f()); privUnsubs = [];
      for (const id of IDS) realNames[id] = {};
      if (isAdmin) {
        for (const id of IDS) {
          privUnsubs.push(db.collection('private_' + id).onSnapshot(snap => {
            const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); realNames[id] = m; renderAll();
          }, () => showNotice('실명 목록을 불러오지 못했어요. 보안 규칙의 관리자 이메일을 확인해 주세요.')));
        }
      } else { showReal = false; }

  async function saveScore(id, p, score) {
    if (mode !== 'db') return { ok: false, code: 'off' };
    const key = await keyOf(p.name);
    const pub = db.collection('scores_' + id).doc(key), priv = db.collection('private_' + id).doc(key);
    const at = Date.now();
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const s = await pub.get();
        const prev = s.exists ? s.data() : null;
        if (!prev || score > prev.score) {
          const batch = db.batch();
          batch.set(pub, { nick: p.nick, score, at });
          batch.set(priv, { name: p.name, nick: p.nick, score, at });
          await batch.commit();
          return { ok: true, best: true, prev: prev ? prev.score : null, key };
        }
        return { ok: true, best: false, prev: prev.score, key };
      } catch (e) {
        if (attempt === 0) { await new Promise(r => setTimeout(r, 500 + Math.random() * 700)); continue; }
        return { ok: false, code: e && e.code, key };
      }
    }
    return { ok: false, key };
  }

  // ---------- 1. 칼 피하기 ----------
  function makeKnife() {

        c.fillRect(o.x - o.w / 2, 0, o.w, PY + 8);
        c.strokeStyle = 'rgba(255,92,147,0.7)'; c.lineWidth = 1.5; c.setLineDash([6, 6]);
        c.strokeRect(o.x - o.w / 2, 0, o.w, PY + 8); c.setLineDash([]);
        c.fillStyle = C.pink; c.textAlign = 'center'; c.font = `700 18px ${NUMFONT}`; c.fillText('!', o.x, 24);
      } else {
        c.fillStyle = 'rgba(255,92,147,0.45)'; c.fillRect(o.x - o.w / 2 - 4, 0, o.w + 8, PY + 8);
        c.fillStyle = C.pink; c.fillRect(o.x - o.w / 2, 0, o.w, PY + 8);
        c.fillStyle = 'rgba(255,255,255,0.85)'; c.fillRect(o.x - 5, 0, 10, PY + 8);
      }
    }
    g.draw = c => {
      c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
      c.fillStyle = 'rgba(243,242,255,0.07)'; c.textAlign = 'center'; c.font = `700 96px ${NUMFONT}`;
      c.fillText(Math.floor(g.t), W / 2, H / 2 - 20);
      for (const o of g.objs) if (o.type === 'laser') drawLaser(c, o);
      c.fillStyle = C.panel; c.fillRect(0, PY + 8, W, H - PY);
      c.fillStyle = C.line; c.fillRect(0, PY + 8, W, 2);
      for (const o of g.objs) {
        if (o.type === 'knife') {
          if (o.y < 10) { c.fillStyle = 'rgba(255,92,147,0.5)'; c.beginPath(); c.moveTo(o.x - 5, 4); c.lineTo(o.x + 5, 4); c.lineTo(o.x, 12); c.fill(); }
          drawKnife(c, o);
        } else if (o.type === 'shuriken') drawShuriken(c, o);
        else if (o.type === 'rock') drawRock(c, o);
        else if (o.type === 'axe') drawAxe(c, o);
      }
      const y = PY - 4 + (g.dead ? 0 : Math.abs(Math.sin(g.bob)) * -2);
      c.fillStyle = g.dead ? C.pink : C.mint;
      c.beginPath(); c.ellipse(g.px, y - 10, 15, 15, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = C.bg;
      c.beginPath(); c.arc(g.px + 4 * g.face, y - 13, 2.6, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.arc(g.px + 10 * g.face, y - 13, 2.6, 0, Math.PI * 2); c.fill();
      c.fillStyle = g.dead ? C.pink : C.mint; c.fillRect(g.px - 9, y + 3, 6, 7); c.fillRect(g.px + 3, y + 3, 6, 7);
    };
    return g;
  }

  // ---------- 2. 장애물 피하기 ----------
  function makeRunner() {
    const GY = 440, P = { x: 64, w: 26, h: 32 };
    const g = { t: 0, dist: 0, speed: 300, y: GY, vy: 0, jumps: 0, obs: [], next: 420, dead: false, fall: false, stars: [], legs: 0, last: '' };
    for (let i = 0; i < 26; i++) g.stars.push({ x: rnd(0, W), y: rnd(20, GY - 140), s: rnd(0.2, 0.6) });
    g.score = () => g.dist / 32;
    g.jump = () => { if (!g.fall && g.jumps < 2) { g.vy = g.jumps === 0 ? -760 : -660; g.jumps++; } };
    g.release = () => { if (g.vy < -260) g.vy *= 0.45; };
    g.down = (p, type, started) => { if (!started) g.jump(); };
    g.up = () => g.release();
    g.key = k => { if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter') g.jump(); };
    g.keyUp = k => { if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter') g.release(); };

    const X0 = W + 30;
    const add = o => { g.obs.push(o); return o; };
    const block = (x, h, w) => add({ type: 'block', x, y: GY - h, w: w || rnd(20, 28), h });
    const PATTERNS = {
      small: () => { block(X0, rnd(24, 38)); return 0; },
      tall: () => { block(X0, rnd(52, 74), rnd(22, 26)); return 0; },
      cluster: () => { let x = X0; const n = pick([2, 3]); for (let i = 0; i < n; i++) { const b = block(x, rnd(26, 42), rnd(18, 24)); x += b.w + 2; } return 40; },
      double: () => { block(X0, rnd(26, 36)); block(X0 + rnd(150, 190), rnd(26, 36)); return 190; },
      pit: () => { const w = rnd(64, 96 + Math.min(40, g.t)); add({ type: 'pit', x: X0, y: GY, w, h: 0 }); return w; },
      lowbird: () => { add({ type: 'bird', x: X0, y: GY - 30, w: 30, h: 18, f: Math.random() * 6 }); return 0; },
      highbird: () => { add({ type: 'bird', x: X0, y: GY - 62 - rnd(0, 18), w: 30, h: 18, f: Math.random() * 6 }); return 0; },
      ball: () => { add({ type: 'ball', x: X0, y: GY - 13, w: 26, h: 26, ph: Math.random() * Math.PI, amp: rnd(70, 110) }); return 0; },
      roof: () => { const b = block(X0, rnd(26, 32), 24); add({ type: 'bird', x: X0 - 3, y: GY - 112, w: 30, h: 18, f: 0 }); return b.w; },
      pitblock: () => { const w = rnd(60, 80); add({ type: 'pit', x: X0, y: GY, w, h: 0 }); block(X0 + w + rnd(110, 140), rnd(26, 40)); return w + 160; },
      spikes: () => { const n = Math.floor(rnd(3, 6)); add({ type: 'spike', x: X0, y: GY - 18, w: n * 16, h: 18 }); return n * 16; },
    };
    function choose() {
      const t = g.t, pool = ['small', 'small', 'tall'];
      if (t > 4) pool.push('pit', 'lowbird', 'spikes');
      if (t > 9) pool.push('highbird', 'cluster', 'ball', 'pit');
      if (t > 16) pool.push('roof', 'double', 'pitblock', 'ball');
      if (t > 26) pool.push('roof', 'pitblock', 'cluster', 'spikes');
      let p; do { p = pick(pool); } while (p === g.last && Math.random() < 0.7);
      g.last = p; return p;
    }
    function overPit() {
      const cx1 = P.x + 8, cx2 = P.x + P.w - 8;
      return g.obs.some(o => o.type === 'pit' && cx1 > o.x && cx2 < o.x + o.w);
    }
    g.update = dt => {
      g.t += dt;
      g.speed = Math.min(720, 300 + g.t * 10);
      if (!g.fall) g.dist += g.speed * dt;
      g.legs += dt * g.speed / 30;
      g.vy += 2300 * dt; g.y += g.vy * dt;
      if (!g.fall && g.y >= GY) {
        if (overPit()) g.fall = true;
        else { g.y = GY; g.vy = 0; g.jumps = 0; }
      }
      if (g.fall && g.y > GY + 90) { g.dead = true; return; }
      if (!g.fall) {
        g.next -= g.speed * dt;
        if (g.next <= 0) { const extra = PATTERNS[choose()](); g.next = g.speed * rnd(0.5, 1.0) + 150 + extra; }
      }
      for (const s of g.stars) { s.x -= g.speed * s.s * 0.2 * dt; if (s.x < 0) { s.x += W; s.y = rnd(20, GY - 140); } }
      const px1 = P.x + 3, px2 = P.x + P.w - 3, py1 = g.y - P.h + 3, py2 = g.y - 1;
      const keep = [];
      for (const o of g.obs) {
        if (!g.fall) o.x -= g.speed * dt;
        if (o.type === 'bird') o.f += dt * 12;
        if (o.type === 'ball') { o.ph += dt * 3.4; o.y = GY - 26 - Math.abs(Math.sin(o.ph)) * o.amp; }
        if (o.x + o.w < -20) continue;
        keep.push(o);
        if (o.type === 'pit' || g.fall) continue;
        const pad = o.type === 'block' ? 2 : 4;
        if (px2 > o.x + pad && px1 < o.x + o.w - pad && py2 > o.y + pad && py1 < o.y + o.h - pad) g.dead = true;
      }
      g.obs = keep;
    };
    g.draw = c => {
      c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
      for (const s of g.stars) { c.fillStyle = `rgba(243,242,255,${0.2 + s.s * 0.5})`; c.fillRect(s.x, s.y, 2, 2); }
      c.fillStyle = C.panel; c.fillRect(0, GY, W, H - GY);
      c.strokeStyle = C.mint; c.lineWidth = 2; c.beginPath(); c.moveTo(0, GY + 1); c.lineTo(W, GY + 1); c.stroke();
      c.strokeStyle = C.line; c.lineWidth = 2;
      const off = g.dist % 40;
      for (let x = -off; x < W; x += 40) { c.beginPath(); c.moveTo(x, GY + 24); c.lineTo(x + 16, GY + 24); c.stroke(); }
      for (const o of g.obs) {
        if (o.type === 'pit') {
          c.fillStyle = C.bg; c.fillRect(o.x, GY - 1, o.w, H - GY + 1);
          c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(o.x, GY + 30, o.w, H - GY);
        } else if (o.type === 'block') {
          c.fillStyle = C.lemon; c.fillRect(o.x, o.y, o.w, o.h);
          c.fillStyle = 'rgba(26,33,96,0.25)'; c.fillRect(o.x + o.w - 5, o.y, 5, o.h);
          c.strokeStyle = 'rgba(26,33,96,0.35)'; c.lineWidth = 2; c.beginPath(); c.moveTo(o.x + 3, o.y + 3); c.lineTo(o.x + o.w - 8, o.y + o.h - 3); c.stroke();
        } else if (o.type === 'spike') {
          c.fillStyle = '#e4e8fa';
          for (let x = o.x; x < o.x + o.w - 1; x += 16) { c.beginPath(); c.moveTo(x, GY); c.lineTo(x + 8, o.y); c.lineTo(x + 16, GY); c.closePath(); c.fill(); }
        } else if (o.type === 'ball') {
          c.fillStyle = C.mint; c.beginPath(); c.arc(o.x + 13, o.y + 13, 13, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(26,33,96,0.3)'; c.beginPath(); c.arc(o.x + 17, o.y + 17, 6, 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(0,0,0,0.2)'; c.beginPath(); c.ellipse(o.x + 13, GY + 3, 10 - (GY - o.y) / 30, 3, 0, 0, Math.PI * 2); c.fill();
        } else {
          const flap = Math.sin(o.f) * 7, cy = o.y + o.h / 2;
          c.fillStyle = C.pink;
          c.beginPath(); c.ellipse(o.x + 16, cy, 14, 7, 0, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.moveTo(o.x + 2, cy - 2); c.lineTo(o.x - 6, cy + 1); c.lineTo(o.x + 2, cy + 3); c.closePath(); c.fill();
          c.beginPath(); c.moveTo(o.x + 10, cy); c.lineTo(o.x + 18, cy - 12 + flap); c.lineTo(o.x + 24, cy); c.closePath(); c.fill();
          c.fillStyle = C.bg; c.fillRect(o.x + 6, cy - 3, 3, 3);
        }
      }
      const y = g.y - P.h;
      if (y < H) {
        c.fillStyle = g.dead || g.fall ? C.pink : C.mint;
        c.beginPath(); c.roundRect ? c.roundRect(P.x, y, P.w, P.h - 6, 6) : c.rect(P.x, y, P.w, P.h - 6); c.fill();
        c.fillStyle = C.bg; c.fillRect(P.x + 16, y + 8, 5, 5);
        c.strokeStyle = g.dead || g.fall ? C.pink : C.mint; c.lineWidth = 4; c.lineCap = 'round';
        const sw = g.y < GY ? 0 : Math.sin(g.legs) * 5;
        c.beginPath(); c.moveTo(P.x + 8, g.y - 6); c.lineTo(P.x + 8 + sw, g.y - 1); c.stroke();
        c.beginPath(); c.moveTo(P.x + 18, g.y - 6); c.lineTo(P.x + 18 - sw, g.y - 1); c.stroke();
      }
      c.textAlign = 'right'; c.fillStyle = 'rgba(243,242,255,0.5)'; c.font = `700 14px ${NUMFONT}`;
      c.fillText('SPEED ' + Math.round(g.speed / 25) + ' m/s', W - 14, 26);
    };
    return g;
  }

  // ---------- 3. 탑 쌓기 ----------
  function makeStack() {
    const BH = 24, BASEW = 200, BASEY = H - 70;
    const g = { level: 0, blocks: [{ x: (W - BASEW) / 2, w: BASEW }], mov: null, dir: 1, falls: [], cam: 0, combo: 0, dead: false, flash: 0, msg: '' };
    g.score = () => g.level;
    const color = i => `hsl(${(i * 11 + 330) % 360} 78% 64%)`;
    function newMover() {
      const last = g.blocks[g.blocks.length - 1];
      g.dir = g.level % 2 === 0 ? 1 : -1;
      g.mov = { x: g.dir > 0 ? 0 : W - last.w, w: last.w, sp: Math.min(440, 150 + g.level * 8) };
    }
    newMover();
    g.idle = dt => { stepMover(dt * 0.6); };
    function stepMover(dt) {
      const m = g.mov; if (!m) return;
      m.x += g.dir * m.sp * dt;
      if (m.x > W - m.w) { m.x = W - m.w; g.dir = -1; }
      if (m.x < 0) { m.x = 0; g.dir = 1; }
    }
    function drop() {
      const last = g.blocks[g.blocks.length - 1], m = g.mov, yTop = g.blocks.length;
      if (!m) return;
      const left = Math.max(m.x, last.x), right = Math.min(m.x + m.w, last.x + last.w), ov = right - left;
      if (ov <= 0) { g.falls.push({ x: m.x, w: m.w, i: yTop, vy: 0, dy: 0, c: color(yTop) }); g.mov = null; g.dead = true; return; }
      let nb;
      if (Math.abs(m.x - last.x) < 4) {
        g.combo++;
        nb = { x: last.x, w: last.w };
        if (g.combo >= 3 && nb.w < BASEW) { const grow = Math.min(8, BASEW - nb.w); nb.w += grow; nb.x = Math.max(0, Math.min(W - nb.w, nb.x - grow / 2)); }
        g.msg = g.combo >= 3 ? 'PERFECT ×' + g.combo : 'PERFECT'; g.flash = 0.8;
      } else {
        g.combo = 0;
        nb = { x: left, w: ov };
        const cutX = m.x < last.x ? m.x : right, cutW = m.w - ov;
        g.falls.push({ x: cutX, w: cutW, i: yTop, vy: 0, dy: 0, c: color(yTop) });
      }
      g.blocks.push(nb);
      g.level++;
      newMover();
    }
    g.down = (p, type, started) => { if (!started) drop(); };
    g.key = k => { if (k === ' ' || k === 'Enter' || k === 'ArrowDown') drop(); };
    g.update = dt => {
      stepMover(dt);
      for (const f of g.falls) { f.vy += 1800 * dt; f.dy += f.vy * dt; }
      g.falls = g.falls.filter(f => f.dy < H + 200);
      const target = Math.max(0, (g.blocks.length + 1) * BH - (BASEY - H * 0.42));
      g.cam += (target - g.cam) * Math.min(1, dt * 6);
      g.flash = Math.max(0, g.flash - dt);
    };
    g.draw = c => {
      c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
      const yOf = i => BASEY - (i + 1) * BH + g.cam;
      c.fillStyle = C.panel; c.fillRect(0, yOf(0) + BH, W, H);
      g.blocks.forEach((b, i) => {
        const y = yOf(i); if (y > H || y < -BH) return;
        c.fillStyle = i === 0 ? C.line : color(i); c.fillRect(b.x, y, b.w, BH - 2);
        c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(b.x, y, b.w, 4);
      });
      for (const f of g.falls) { c.fillStyle = f.c; c.globalAlpha = 0.8; c.fillRect(f.x, yOf(f.i) + f.dy, f.w, BH - 2); c.globalAlpha = 1; }
      if (g.mov) {
        const y = yOf(g.blocks.length);
        c.fillStyle = color(g.blocks.length); c.fillRect(g.mov.x, y, g.mov.w, BH - 2);
        c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(g.mov.x, y, g.mov.w, 4);
      }
      c.textAlign = 'center'; c.fillStyle = 'rgba(243,242,255,0.09)'; c.font = `700 110px ${NUMFONT}`;
      c.fillText(g.level, W / 2, 150);
      if (g.flash > 0) {
        c.globalAlpha = Math.min(1, g.flash * 2); c.fillStyle = C.lemon; c.font = `700 22px ${NUMFONT}`;
        c.fillText(g.msg, W / 2, 200); c.globalAlpha = 1;
      }
    };
    return g;
  }

  $('adminBtn').addEventListener('click', () => {
    if (!auth) { showNotice('Firebase 설정값을 먼저 채워 주세요.'); return; }
    if (auth.currentUser) { auth.signOut(); return; }
    $('adminErr').textContent = ''; $('adPw').value = ''; $('adminModal').hidden = false; setTimeout(() => $('adPw').focus(), 30);
  });
  $('adminCancel').addEventListener('click', () => { $('adminModal').hidden = true; });
  $('adminForm').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await auth.signInWithEmailAndPassword(String(window.ADMIN_EMAIL || ''), $('adPw').value);
      $('adPw').value = ''; $('adminModal').hidden = true;
    } catch { $('adminErr').textContent = '비밀번호가 맞지 않아요.'; }
  });

  buildStatic();
  renderAll();
  initStore();
})();
</script>
